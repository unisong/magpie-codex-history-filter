name: 过滤未生效 / Magpie 插件异常
description: 提供诊断结果与网关插件页运行证据，勿上传配置或凭据。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        可下载仓库或安装包，运行 Diagnose.bat（需 Node.js 18+ 或 Bun），或参考 README 的只读诊断命令。
        此工具只检查配置，不能代替运行中 Magpie 的调用/失败统计。
        不要上传 plugins.json、providers.json、config.toml、原始会话、API Key 或完整请求日志。
  - type: input
    id: versions
    attributes:
      label: 插件、Magpie、Codex 版本与操作系统
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装来源
      options: [Magpie 社区市场, GitHub 标签, 本地目录, 旧版管理服务自动安装, 不确定]
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 发生时间和时区
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤、预期行为与实际报错
      description: 说明是否更换供应商、是否有旧会话、是否有自动路由/fallback/其他请求插件；删除隐私内容。
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: Magpie 插件页运行证据
      description: 复现前后的调用数、失败数和最后错误。截图先遮挡供应商、邮箱、路径或凭据；CLI 的计数不能代表正在运行的网关。
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断报告
      description: 上传工具生成的诊断 JSON。配置匹配不等于已经完成过滤；无法导出时请说明原因。
